# Auto Trading 백테스트 기본 설정
# SKILL.md와 commands에서 참조

# 서버 설정
server:
  base_url: http://localhost:8001
  api_prefix: /api/v1/strategies

# 거래소별 기본값
exchanges:
  kiwoom:
    exchange_name: Kiwoom
    default_interval: 1d
    default_days: 365
    default_capital: 10000000    # 1천만원
    min_data_bars: 50

  binance_spot:
    exchange_name: Binance
    default_interval: 1h
    default_days: 180
    default_capital: 10000       # 10,000 USDT
    min_data_bars: 50

  binance_futures:
    exchange_name: Binance
    default_interval: 1h
    default_days: 90
    default_capital: 10000
    default_leverage: 5
    default_position_side: long
    min_data_bars: 50

# 성과 판정 기준
thresholds:
  excellent:
    sharpe_ratio: 1.5
    max_drawdown: -15
    win_rate: 55
    profit_factor: 2.0
  good:
    sharpe_ratio: 1.0
    max_drawdown: -20
    win_rate: 50
    profit_factor: 1.5
  acceptable:
    sharpe_ratio: 0.5
    max_drawdown: -30
    profit_factor: 1.0
  min_cycles: 30               # 최소 매매 사이클 수

# 최적화 설정
optimization:
  default_execution_mode: fast  # fast (병렬) or standard (순차)
  max_combinations: 100000      # 이 이상이면 경고

# Walk-Forward 설정
walk_forward:
  default_is_days: 180          # In-Sample 기본 기간
  default_oos_days: 60          # Out-of-Sample 기본 기간
  min_windows: 3                # 최소 윈도우 수
  efficiency_ratio_threshold: 0.5  # OOS Sharpe / IS Sharpe

# 점수 기본 가중치
score_weights:
  return_weight: 1.0
  sharpe_weight: 1.2
  stability_weight: 1.0
  mdd_weight: 1.5
